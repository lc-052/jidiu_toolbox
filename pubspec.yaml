name: jidiu_toolbox
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Hive 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  # QR 码生成
  qr_flutter: ^4.1.0
  # AI 对话 HTTP 请求
  http: ^1.2.2
  # 唯一ID生成
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "图标.jpg"
  windows:
    generate: true
    icon_size: 256
  web:
    generate: true
    background_color: "#ffffff"
    theme_color: "#536dfe"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
